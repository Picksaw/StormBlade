<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#05060f" />
    <meta name="author" content="Picksaw Studio" />
    <meta name="description" content="STORMBLADE — hurl your lightning sword, blink to it, and cut down the beasts of the storm. Published by Picksaw Studio." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <title>STORMBLADE ⚡ Lightning Sword Arena — Picksaw Studio</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Telegram Mini App SDK (safe no-op outside Telegram) -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
      var isNative = !!(window.Capacitor || navigator.userAgent.indexOf('Electron') !== -1);
      if ('serviceWorker' in navigator && location.protocol !== 'file:' && !isNative) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register("./sw.js").catch(() => {});
        });
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
