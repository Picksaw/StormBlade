<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#19204a"/>
      <stop offset="60%" stop-color="#0c1130"/>
      <stop offset="100%" stop-color="#05060f"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" stroke="#79f2ff" stroke-width="12"/>
  <rect x="18" y="18" width="476" height="476" rx="98" fill="none" stroke="#a97bff" stroke-width="6" opacity="0.4"/>
  
  <!-- Lightning Nova Glow -->
  <circle cx="256" cy="256" r="160" fill="#79f2ff" opacity="0.15" filter="url(#glow)"/>
  
  <!-- Sword Blade -->
  <g transform="rotate(-45 256 256)">
    <!-- Blade body -->
    <path d="M420 256 L300 220 L160 236 L160 276 L300 292 Z" fill="#dff9ff" stroke="#79f2ff" stroke-width="10" filter="url(#glow)"/>
    <!-- Electric core -->
    <path d="M180 256 L230 242 L280 268 L340 248 L390 256" fill="none" stroke="#ffd166" stroke-width="8" stroke-linecap="round"/>
    <!-- Crossguard -->
    <rect x="146" y="196" width="22" height="120" rx="6" fill="#2a3f7a" stroke="#ffd166" stroke-width="5"/>
    <!-- Grip & Pommel -->
    <rect x="80" y="238" width="66" height="36" rx="6" fill="#101a3a" stroke="#79f2ff" stroke-width="4"/>
    <circle cx="64" cy="256" r="18" fill="#ffd166" stroke="#ff4d6d" stroke-width="6"/>
  </g>
  
  <!-- Bolt Emblem -->
  <path d="M280 80 L180 220 L240 220 L200 320 L320 180 L256 180 Z" fill="#ffd166" opacity="0.9" filter="url(#glow)"/>
</svg>
